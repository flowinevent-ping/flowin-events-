<style>
:root{
  --bg:#F1F5F9; --card:#FFF; --subtle:#F8FAFC; --line:#E2E8F0; --line2:#CBD5E1;
  --ink:#0F172A; --muted:#64748B; --acc:#7C2D92; --acc-lt:#A855F7;
  --se:#A855F7; --ev:#10B981; --bar:#7C2D92; --grid:#E2E8F0;
  --sh:0 2px 6px rgba(15,23,42,.06),0 18px 46px -20px rgba(15,23,42,.35);
  --ph:#16202E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --card:#131C2B; --subtle:#0F1826; --line:#243247; --line2:#33445E;
  --ink:#E8EEF7; --muted:#8496AE; --acc:#C084FC; --acc-lt:#D8B4FE;
  --se:#C084FC; --ev:#34D399; --bar:#C084FC; --grid:#243247;
  --sh:0 2px 6px rgba(0,0,0,.4),0 20px 50px -22px rgba(0,0,0,.85);
  --ph:#05090F;
}}
:root[data-theme="dark"]{
  --bg:#0B1220; --card:#131C2B; --subtle:#0F1826; --line:#243247; --line2:#33445E;
  --ink:#E8EEF7; --muted:#8496AE; --acc:#C084FC; --acc-lt:#D8B4FE;
  --se:#C084FC; --ev:#34D399; --bar:#C084FC; --grid:#243247;
  --sh:0 2px 6px rgba(0,0,0,.4),0 20px 50px -22px rgba(0,0,0,.85);
  --ph:#05090F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 70px}
.shell{display:grid;grid-template-columns:212px 1fr;gap:14px;align-items:start}
@media(max-width:860px){.shell{grid-template-columns:1fr}}
.sb{background:linear-gradient(180deg,#1E293B,#152032);border-radius:14px;padding-bottom:10px;overflow:hidden;position:sticky;top:16px}
.sb-logo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.09);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;gap:7px}
.sb-logo i{width:8px;height:8px;border-radius:50%;background:#A855F7;box-shadow:0 0 9px #A855F7;font-style:normal}
.sb-g{display:flex;align-items:center;gap:7px;padding:14px 14px 6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.sb-g i{width:4px;height:12px;border-radius:2px;display:block;font-style:normal}
.sb-i{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 18px;color:rgba(255,255,255,.78);font-size:12px;
  font-weight:600;cursor:pointer;border:0;border-left:3px solid transparent;background:none;width:100%;text-align:left;font-family:inherit}
.sb-i:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-i.on{background:linear-gradient(90deg,rgba(168,85,247,.22),transparent);color:#fff;border-left-color:#A855F7;font-weight:800}
.sb-i b{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,.13);border-radius:99px;padding:1px 6px;font-weight:700}
.sb-i.stat{cursor:default;opacity:.55}
.sb-i.stat:hover{background:none;color:rgba(255,255,255,.78)}
.switch{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.switch button{min-width:210px}
.switch button{flex:1;padding:13px 15px;border-radius:12px;border:2px solid var(--line);background:var(--card);
  color:var(--ink);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;text-align:left;line-height:1.3}
.switch button span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px}
.switch button.on[data-d="se"]{border-color:var(--se)}
.switch button.on[data-d="ev"]{border-color:var(--ev)}
.switch button.on[data-d="pro"]{border-color:var(--acc)}
.note{font-size:12px;color:var(--muted);margin:0 0 14px}

.dr{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.dr-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.dr-back{background:none;border:1px solid var(--line);border-radius:7px;padding:3px 10px;font-size:11.5px;
  font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit;margin-bottom:9px}
.dr-back:hover{background:var(--subtle)}
.dr-t{font-size:17px;font-weight:900;display:flex;align-items:center;gap:9px}
.dr-s{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dr-x{width:30px;height:30px;border-radius:50%;border:0;background:var(--subtle);color:var(--muted);
  font-size:18px;line-height:1;cursor:pointer;flex-shrink:0}
.pill{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.se{background:color-mix(in srgb,var(--se) 18%,transparent);color:var(--se)}
.pill.ev{background:color-mix(in srgb,var(--ev) 18%,transparent);color:var(--ev)}
.pill.g{background:var(--subtle);border:1px solid var(--line);color:var(--muted)}

.n1{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.n1 button{padding:12px 12px;font-size:12.5px;font-weight:800;color:var(--muted);border:0;border-bottom:3px solid transparent;
  background:none;cursor:pointer;white-space:nowrap;font-family:inherit;display:flex;align-items:center;gap:6px}
.n1 button:hover{color:var(--ink)}
.n1 button.on{color:var(--acc);border-bottom-color:var(--acc)}
.n1 .n{font-size:10px;font-weight:800;background:var(--subtle);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.n1 button.on .n{background:var(--acc);color:#fff;border-color:transparent}
.n2{display:flex;gap:6px;padding:10px 18px;background:var(--subtle);border-bottom:1px solid var(--line);overflow-x:auto}
.n2 button{padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--muted);
  font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.n2 button:hover{color:var(--ink);border-color:var(--ink)}
.n2 button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.n2-lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px;flex-shrink:0}
.dr-b{padding:16px 20px;min-height:360px}
/* niveau 3 — la fiche dans la fiche */
.n3-bar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--ev) 10%,var(--card));
  border:1px solid color-mix(in srgb,var(--ev) 35%,transparent);border-radius:10px;padding:9px 12px;margin-bottom:10px;flex-wrap:wrap}
.n3-bar .r{background:var(--card);border:1px solid var(--line2);border-radius:7px;padding:3px 9px;font-size:11.5px;
  font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit}
.n3-bar .r:hover{background:var(--subtle)}
.n3-bar .t{font-weight:800;font-size:13px}
.n3-bar .d{font-size:11.5px;color:var(--muted)}
.n3{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.n3 button{padding:8px 11px;font-size:12px;font-weight:700;color:var(--muted);border:0;border-bottom:2px solid transparent;
  background:none;cursor:pointer;white-space:nowrap;font-family:inherit}
.n3 button:hover{color:var(--ink)}
.n3 button.on{color:var(--ev);border-bottom-color:var(--ev)}
.grp{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
.grp:first-child{margin-top:0}
.chemin{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);margin-bottom:12px}
.chemin b{color:var(--acc)}

/* tableur */
.tb-bar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.tb-bar input{flex:1;min-width:160px;padding:7px 11px;border:1px solid var(--line2);border-radius:8px;
  background:var(--subtle);color:var(--ink);font-family:inherit;font-size:12.5px;outline:none}
.tb-bar input:focus{border-color:var(--acc)}
.tb-bar .cnt{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.tbw{border:1px solid var(--line);border-radius:10px;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  padding:9px 12px;background:var(--subtle);border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th .ar{opacity:.28;font-size:9px;margin-left:3px}
th.on .ar{opacity:1;color:var(--acc)}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--subtle)}
tbody tr:last-child td{border-bottom:0}
.lien{color:var(--acc);font-weight:700}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kb-col{background:var(--subtle);border:1px solid var(--line);border-radius:10px;padding:9px}
.kb-t{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.kb-c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
.kb-c:hover{border-color:var(--acc)}
.kb-c .n{font-weight:800;font-size:12px}
.kb-c .d{font-size:10.5px;color:var(--muted);margin-top:3px}

/* stats */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.kpi div{background:var(--subtle);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi .v{font-size:20px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:5px}
.ch{position:relative;margin-top:6px}
.ch svg{display:block;width:100%;height:150px;overflow:visible}
.ch .bar{fill:var(--bar);rx:3}
.ch .bar:hover{opacity:.75}
.ch .gl{stroke:var(--grid);stroke-width:1}
.ch .ax{fill:var(--muted);font-size:9px;font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:11px;font-weight:700;
  padding:4px 8px;border-radius:6px;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s;white-space:nowrap}
.tip.on{opacity:1}
.ch-t{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}

/* apercu telephone */
.prev{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.phone{width:236px;height:472px;border:9px solid var(--ph);border-radius:26px;background:#fff;overflow:hidden;flex-shrink:0;
  box-shadow:0 10px 30px -14px rgba(15,23,42,.5);position:relative}
.scr{position:absolute;inset:0;padding:16px 14px;color:#0F172A;font-size:12px;display:flex;flex-direction:column;background:#fff}
.scr h5{margin:0 0 4px;font-size:16px;font-weight:900}
.scr p{margin:0 0 10px;font-size:11px;color:#64748B;line-height:1.45}
.scr .b{background:#7C2D92;color:#fff;border-radius:9px;padding:9px;text-align:center;font-weight:800;font-size:12px;margin-top:auto}
.scr .q{border:1px solid #E2E8F0;border-radius:8px;padding:8px 10px;font-size:11.5px;font-weight:700;margin-bottom:6px}
.scr .q.ok{border-color:#15803D;background:rgba(34,197,94,.1);color:#15803D}
.scr .hd{background:linear-gradient(135deg,#7C2D92,#A855F7);margin:-16px -14px 12px;padding:16px 14px;color:#fff}
.scr .hd h5{color:#fff}
.scr .hd p{color:rgba(255,255,255,.85);margin:0}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.nav button{padding:5px 11px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--muted);
  font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.nav button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.pcol{flex:1;min-width:230px}
#qrbox{width:150px;height:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;place-items:center}
#qrbox img,#qrbox canvas{width:100%;height:100%;display:block}
.dl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dl button{padding:6px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.dl button:hover{border-color:var(--acc);color:var(--acc)}

.fr{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.fr span:first-child{color:var(--muted)}
.fr span:last-child{font-weight:700;text-align:right}
.mono{font-family:"JetBrains Mono",monospace;font-size:11.5px}
h4{margin:16px 0 8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h4:first-child{margin-top:0}
footer{max-width:1000px;margin:0 auto;padding:0 18px 60px;font-size:12.5px;color:var(--muted);line-height:1.6}
footer b{color:var(--ink)}
</style>

/* ─── tableur générique : recherche + tri par flèches ─── */
let tri={c:null,sens:-1}, rech='';
function tableau(cols,rows,onClic){
  const t=rech.trim().toLowerCase();
  let r=rows.filter(x=>!t||cols.some(c=>String(x[c.k]).toLowerCase().includes(t)));
  if(tri.c){
    const c=cols.find(x=>x.k===tri.c);
    r=[...r].sort((a,b)=>{
      const va=a[tri.c],vb=b[tri.c];
      const n=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb),'fr');
      return n*tri.sens;
    });
  }
  window.__rows=r; window.__clic=onClic;
  return `<div class="tb-bar">
    <input id="rech" placeholder="Rechercher…" value="${esc(rech)}">
    <span class="cnt">${r.length} ligne${r.length>1?'s':''}</span></div>
   <div class="tbw"><table><thead><tr>${cols.map(c=>
     `<th class="${c.n?'r ':''}${tri.c===c.k?'on':''}" data-k="${c.k}">${esc(c.l)}<span class="ar">${tri.c===c.k?(tri.sens===1?'▲':'▼'):'▼'}</span></th>`).join('')}</tr></thead>
   <tbody>${r.map((x,i)=>`<tr data-i="${i}">${cols.map(c=>
     `<td class="${c.n?'r':''}${c.lien?' lien':''}">${esc(x[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function brancherTableau(){
  const inp=$('rech');
  if(inp) inp.oninput=e=>{rech=e.target.value; rendre(true); const i=$('rech'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);} };
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    tri = tri.c===k ? {c:k,sens:tri.sens===1?-1:1} : {c:k,sens:-1};
    rendre(true);
  });
  document.querySelectorAll('tbody tr[data-i]').forEach(tr=>tr.onclick=()=>{
    if(window.__clic) window.__clic(window.__rows[+tr.dataset.i]);
  });
}

/* ─── graphique barres, série unique ─── */
function barres(data,titre,unite){
  const W=100,H=150,P=22,max=Math.max(...data.map(d=>d[1])),n=data.length;
  const bw=100/n*0.62, gap=100/n*0.38;
  const bars=data.map((d,i)=>{
    const h=(d[1]/max)*(H-P-16), x=(i*100/n)+gap/2, y=H-P-h;
    return `<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${h}" rx="1.2"
      data-l="${esc(d[0])}" data-v="${d[1]}" vector-effect="non-scaling-stroke"></rect>`;
  }).join('');
  const labs=data.map((d,i)=>`<text class="ax" x="${(i*100/n)+gap/2+bw/2}" y="${H-8}" text-anchor="middle">${esc(d[0])}</text>`).join('');
  return `<div class="ch-t">${esc(titre)}</div><div class="ch" id="chw">
    <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none">
      <line class="gl" x1="0" y1="${H-P}" x2="100" y2="${H-P}" vector-effect="non-scaling-stroke"/>
      ${bars}</svg>
    <svg viewBox="0 0 100 ${H}" style="position:absolute;inset:0;pointer-events:none">${labs}</svg>
    <div class="tip" id="tip"></div></div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">Maximum : <b>${max} ${esc(unite)}</b></div>`;
}
function brancherCh(unite){
  const w=$('chw'); if(!w) return; const tip=$('tip');
  w.querySelectorAll('.bar').forEach(b=>{
    b.onmouseenter=e=>{const r=b.getBoundingClientRect(),c=w.getBoundingClientRect();
      tip.textContent=`${b.dataset.l} — ${b.dataset.v} ${unite}`;
      tip.style.left=(r.left-c.left+r.width/2)+'px'; tip.style.top=(r.top-c.top)+'px'; tip.classList.add('on');};
    b.onmouseleave=()=>tip.classList.remove('on');
  });
}

    c.o=b.dataset.o; c.s=D[c.d].onglets.find(x=>x.id===c.o).sous[0].id; c.sf=null; rech=''; tri={c:null,sens:-1}; rendre();
  });
  $('n2').style.display = c.sf ? 'none' : '';
  $('n2').innerHTML=`<span class="n2-lbl">Sous-onglets</span>`+ong.sous.map(x=>
    `<button class="${x.id===c.s?'on':''}" data-s="${x.id}">${esc(x.l)}</button>`).join('');
  $('n2').querySelectorAll('button').forEach(b=>b.onclick=()=>{ c.s=b.dataset.s; c.sf=null; rech=''; tri={c:null,sens:-1}; rendre(); });

  const html=contenu(c);
  $('b').innerHTML=`<div class="chemin">${c.d==='se'?'Super event':c.d==='ev'?'Event':c.d==='pro'?'Pro':'Joueur'} › <b>${esc(ong.l)}</b> › <b>${esc(so.l)}</b></div>`+(html||vide(so.l));
  brancherTableau(); brancherKanban(); brancherApercu();
  document.querySelectorAll('[data-sf]').forEach(el=>el.onclick=()=>{
    const [n,se]=el.dataset.sf.split('|');
    const e=(window.__sf||[]).find(x=>x.nom===n&&x.se===se); if(e) ouvrirSousFiche(e);
  });
  document.querySelectorAll('[data-fermer]').forEach(b=>b.onclick=fermerSousFiche);
  document.querySelectorAll('[data-sfo]').forEach(b=>b.onclick=()=>{ cur().sfo=b.dataset.sfo; rendre(); });
  $('foot').innerHTML = `<b>Reste HORS drawer, au niveau général —</b> ces écrans ne dépendent d'aucun event, d'aucun pro :
    prospection terrain, prospects B2B, contacts landing, retours CRM, bibliothèque des templates de jeux,
    plaquettes commerciales, argumentaire téléphonique, packs de participation, CGV, stats toutes opérations.
    <br><br><b>Ce qui manque à construire :</b> le drawer Super Event (il n'en a aucun aujourd'hui),
    les sous-onglets, l'aperçu navigable du jeu, le QR téléchargeable, et le regroupement du commercial
    dans la fiche pro (devis, bon de commande, facture et souscription sont aujourd'hui 5 entrées de menu séparées).`;
}

/* Un sous-onglet sans contenu propre doit le DIRE, jamais afficher celui d'un
   autre : c'est exactement le bug qu'avait « Contrat & CGV », qui recopiait
   silencieusement l'écran « Général ». */
function vide(l){
  return `<div style="border:1px dashed var(--line2);border-radius:10px;padding:22px;text-align:center;color:var(--muted)">
    <div style="font-weight:800;font-size:13px;color:var(--ink)">« ${esc(l)} » n'est pas encore maquetté</div>
    <div style="font-size:12px;margin-top:5px">Écran vide volontairement — il ne recopie pas le contenu d'un autre sous-onglet.</div></div>`;
}

function contenu(c){
  const k=a=>`<div class="kpi">${a.map(x=>`<div><div class="v">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('')}</div>`;
  const f=a=>a.map(x=>`<div class="fr"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('');
  const colsSt=[{k:'nom',l:'Station'},{k:'type',l:'Type'},{k:'pro',l:'Pro',lien:1},
    {k:'flashs',l:'Flashs',n:1},{k:'parties',l:'Parties',n:1},{k:'joueurs',l:'Joueurs',n:1},{k:'rejoue',l:'Rejoué',n:1},{k:'pic',l:'Pic'}];
  const colsJo=[{k:'nom',l:'Joueur'},{k:'ville',l:'Ville'},{k:'cp',l:'CP'},
    {k:'parties',l:'Parties',n:1},{k:'lots',l:'Lots',n:1},{k:'optin',l:'Opt-in'}];
  const colsPro=[{k:'nom',l:'Pro / partenaire'},{k:'role',l:'Rôle'},{k:'stations',l:'Stations',n:1},
    {k:'flashs',l:'Flashs',n:1},{k:'joueurs',l:'Joueurs',n:1},{k:'statut',l:'Statut'}];
  const colsLot=[{k:'nom',l:'Lot'},{k:'partenaire',l:'Partenaire',lien:1},{k:'type',l:'Type'},
    {k:'qte',l:'Quantité',n:1},{k:'restant',l:'Restant',n:1},{k:'valeur',l:'Valeur €',n:1}];
  const versEvent=s=>ouvrir('ev',s);
  const versPro=nom=>{const p=PROS.find(x=>x.nom===nom)||PROS[0];ouvrir('pro',p);};
  const versJoueur=j=>ouvrir('jo',j);

  if(c.d==='se'){
    if(c.o==='apercu'){
      if(c.s==='chiffres') return k([[21,'Stations'],[2847,'Flashs'],[986,'Parties'],[617,'Joueurs']])+
        f([['Période','09/07 → 18/07'],['Organisateur','Ville de Vence'],['Jours avec activité','53'],['Lots distribués','118']]);
      if(c.s==='jours'){ setTimeout(()=>brancherCh('flashs'),0);
        return barres(JOURS,'Flashs par jour du festival','flashs'); }
      return kanban(STATIONS,versEvent);
    }
    if(c.o==='stations'){
      if(c.s==='nds') return tableau(colsSt,STATIONS.filter(s=>s.type==='Station NDS'),versEvent);
      if(c.s==='part') return tableau(colsSt,STATIONS.filter(s=>s.type==='Partenaire'),versEvent);
      if(c.s==='kanban') return kanban(STATIONS,versEvent);
      return tableau(colsSt,STATIONS,versEvent);
    }
    if(c.o==='joueurs'){
      if(c.s==='optin') return tableau(colsJo,JOUEURS.filter(j=>j.optin==='Oui'),versJoueur);
      if(c.s==='fideles') return tableau(colsJo,JOUEURS.filter(j=>j.parties>=4),versJoueur);
      return tableau(colsJo,JOUEURS,versJoueur);
    }
    if(c.o==='lots'){
      if(c.s==='tirage') return f([['Tirages effectués','118'],['Lots restants','22'],['Scopé sur','Nuits du Sud 2026'],['Dernier tirage','18/07 à 23h']]);
      if(c.s==='gagnants') return tableau(colsJo,JOUEURS.filter(j=>j.lots>0),versJoueur);
      return tableau(colsLot,LOTS,l=>versPro(l.partenaire));
    }
    if(c.o==='pros'){
      if(c.s==='pros') return tableau(colsPro,PROS.filter(p=>p.role!=='Partenaire'),p=>ouvrir('pro',p));
      if(c.s==='commerces') return tableau(colsPro,PROS.filter(p=>p.role==='Partenaire'),p=>ouvrir('pro',p));
      return tableau(colsPro,PROS,p=>ouvrir('pro',p));
    }
    if(c.o==='landing'){
      if(c.s==='toutes') return tableau(
        [{k:'nom',l:'Page'},{k:'fam',l:'Famille'},{k:'url',l:'URL'},{k:'apercu',l:'Aperçu'}],
        PAGES, null)+
        `<p style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px">
         Les <b>24</b> pages publiques du produit : 13 landings et pages commerciales,
         7 parcours de jeu, 4 pages du super event. Une seule n'est pas prévisualisable —
         la landing « Nuits du Sud 2026 — Partenaires », qui est un brouillon sans URL déployée.
         Rien ne disparaît du rangement : cet inventaire reste accessible en entier.</p>`;
      const u=c.s==='rejoindre'?'https://flowin-events.vercel.app/rejoindre/se-nds-2026'
             :c.s==='sponsor'?'https://flowin-events.vercel.app/sponsor/se-nds-2026'
             :'https://flowin-events.vercel.app/se/se-nds-2026';
      setTimeout(()=>brancherQr(u),0);
      return apercu([['se','Page du super event'],['carte','Carte des points']],u)+
        `<div style="margin-top:18px">`+blocQr(u)+`</div>`;
    }
  }

  if(c.d==='ev'){
    const e=c.ctx||STATIONS[0];
    if(c.o==='infos'){
      if(c.s==='ratt') return f([['Pro propriétaire',`<span class="lien">${esc(e.pro)} ›</span>`],
        ['Super event','<span class="lien">Nuits du Sud 2026 ›</span>'],['Type',esc(e.type)]]);
      if(c.s==='visib') return f([['Stats','visible'],['Participants','visible'],['Lots','visible'],['QR','visible'],['Export','visible']]);
      return f([['Nom',esc(e.nom)],['Module',esc(e.module)],['Dates','09/07 → 18/07'],['Lieu','Vence'],['Statut',esc(e.etat)]]);
    }
    if(c.o==='jeu'){
      if(c.s==='contenu') return f([['Banques','2 sélectionnées'],['Questions disponibles','34'],['Questions par partie','5']]);
      if(c.s==='regles') return f([['Chronomètre','30 s'],['Score minimum','0'],['Gain','Tirage au sort']]);
      return apercu([['accueil','Accueil'],['quiz','Question'],['resultat','Résultat'],['carte','Carte']],
        `https://flowin-events.vercel.app/parcours/${e.module}?ev=…`);
    }
    if(c.o==='stats'){
      if(c.s==='heure'){ setTimeout(()=>brancherCh('flashs'),0); return barres(HEURES,'Flashs par heure','flashs'); }
      if(c.s==='origines') return f([['Physique (QR affiche)',e.flashs],['Digital (lien partagé)',0],['Heure de pic',esc(e.pic)]]);
      return k([[e.flashs,'Flashs'],[e.parties,'Parties'],[e.joueurs,'Joueurs'],[e.rejoue,'Ont rejoué']]);
    }
    if(c.o==='joueurs') return tableau(colsJo, c.s==='optin'?JOUEURS.filter(j=>j.optin==='Oui'):JOUEURS, versJoueur);
    if(c.o==='lots'){
      if(c.s==='gagnants') return tableau(colsJo,JOUEURS.filter(j=>j.lots>0),versJoueur);
      return tableau(colsLot,LOTS.slice(0,3),l=>versPro(l.partenaire));
    }
    if(c.o==='qr'){
      const u=`https://flowin-events.vercel.app/parcours/${e.module}?ev=ev-caisse2`;
      if(c.s==='qr'){ setTimeout(()=>brancherQr(u),0); return blocQr(u); }
      return apercu([['accueil','Accueil'],['quiz','Question'],['resultat','Résultat']],u);
    }
  }

  if(c.d==='pro'){
    const p=c.ctx||PROS[0];
    const st=STATIONS.filter(s=>s.pro===p.nom);
    if(c.o==='infos'){
      if(c.s==='contact') return f([['Contact','Service événementiel'],['Email','contact@exemple.fr'],
        ['Téléphone','04 93 00 00 00'],['Adresse','Place du Grand Jardin, 06140 Vence'],['SIRET','—']]);
      if(c.s==='contrat') return f([
        ['CGV acceptées','Oui — le 15/06/2026'],
        ['Version des CGV','v2.1 (01/2026)'],
        ['Contrat signé','Oui — BC-2026-014 du 18/06'],
        ['Durée','Nuits du Sud 2026 · 09/07 → 18/07'],
        ['Reconduction','Non tacite'],
        ['Pièces jointes','Bon de commande signé · CGV v2.1']])+
        `<p style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:12px">
         Les CGV sont aujourd'hui une page générale du menu, identique pour tout le monde.
         Ici on voit <b>ce que ce pro a accepté, et quand</b> — c'est l'information qui manque
         quand un partenaire conteste quelque chose.</p>`;
      return f([['Nom',esc(p.nom)],['Rôle',esc(p.role)],['Stations',p.stations],
        ['Flashs',p.flashs],['Joueurs',p.joueurs],['Statut',esc(p.statut)]]);
    }
    if(c.o==='stations'){
      const mes=evDuPro(p.nom);
      /* FICHE DANS LA FICHE : une station ouverte reste A L INTERIEUR de la fiche
         du pro. On ne perd pas le contexte — un pro a plusieurs events, chacun
         avec son propre jeu et sa propre comm. */
      if(c.sf){
        const e=c.sf;
        const corps = c.sfo==='jeu'
            ? f([['Module',esc(e.module)],['Banques','2 sélectionnées · 34 questions'],
                 ['Questions par partie','5'],['Chronomètre','30 s']])+
              `<p style="font-size:11.5px;color:var(--muted);margin-top:10px">Propre à CET event : deux stations du même pro peuvent avoir des jeux différents.</p>`
          : c.sfo==='comm'
            ? f([['Billets émis',e.joueurs?7:0],['Kit com','A3 · A4 · QR'],['Emails envoyés',e.joueurs?3:0],['Visuels',e.se==='Modèle (gabarit)'?'—':'4 formats']])+
              `<p style="font-size:11.5px;color:var(--muted);margin-top:10px">La comm est portée par l'event, pas par le compte : elle change d'une opération à l'autre.</p>`
          : c.sfo==='stats'
            ? `<div class="kpi"><div><div class="v">${e.flashs}</div><div class="l">Flashs</div></div>
               <div><div class="v">${e.parties}</div><div class="l">Parties</div></div>
               <div><div class="v">${e.joueurs}</div><div class="l">Joueurs</div></div>
               <div><div class="v">${e.etat}</div><div class="l">État</div></div></div>`
          : c.sfo==='joueurs' ? tableau(colsJo,JOUEURS.slice(0,3),versJoueur)
          : c.sfo==='lots'    ? tableau(colsLot,LOTS.slice(0,2),null)
          : c.sfo==='qr'      ? f([['Lien du parcours',`<span class="mono">/parcours/${esc(e.module)}?ev=…</span>`],
                                   ['Fiche publique',`<span class="mono">/se/…/${esc(e.nom)}</span>`],['Téléchargements','PNG · SVG · A4']])
          : f([['Station',esc(e.nom)],['Super event',esc(e.se)],['Module',esc(e.module)],['État',esc(e.etat)]]);
        return `<div class="n3-bar">
            <button class="r" data-fermer="1">← Toutes ses stations</button>
            <span class="t">🎬 ${esc(e.nom)}</span>
            <span class="d">${esc(e.se)} · ${esc(e.module)}</span></div>
          <div class="n3">${ONG_EV.map(o=>
            `<button class="${o.id===c.sfo?'on':''}" data-sfo="${o.id}">${esc(o.l)}</button>`).join('')}</div>${corps}`;
      }
      if(c.s==='kanban') return kanban(mes.map(e=>({...e,etat:e.etat})),ouvrirSousFiche);
      if(c.s==='liste') return tableau(
        [{k:'nom',l:'Station'},{k:'se',l:'Super event'},{k:'module',l:'Jeu'},{k:'etat',l:'État'},
         {k:'flashs',l:'Flashs',n:1},{k:'parties',l:'Parties',n:1},{k:'joueurs',l:'Joueurs',n:1}],
        mes, ouvrirSousFiche);
      const groupes=[...new Set(mes.map(e=>e.se))];
      window.__sf=mes;
      return groupes.map(g=>`<div class="grp">${esc(g)} · ${mes.filter(e=>e.se===g).length}</div>`+
        mes.filter(e=>e.se===g).map(e=>`<div class="row" data-sf="${esc(e.nom)}|${esc(e.se)}">
          <div><div class="n">${esc(e.nom)}</div><div class="d">${esc(e.module)} · ${esc(e.etat)}</div></div>
          <div class="r">${e.flashs} flashs<br>${e.joueurs} joueurs</div></div>`).join('')).join('')+
        `<p style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:12px">
         Un même commerce a un event par super event. Clique une station : sa fiche
         s'ouvre <b>dans</b> celle du pro, avec son jeu et sa comm à elle.</p>`;
    }
    if(c.o==='stats'){
      if(c.s==='heure'){ setTimeout(()=>brancherCh('flashs'),0); return barres(HEURES,'Flashs par heure','flashs'); }
      return k([[p.flashs,'Flashs'],[st.reduce((a,b)=>a+b.parties,0),'Parties'],[p.joueurs,'Joueurs'],[p.stations,'Stations']]);
    }
    if(c.o==='qr'){
      const u='https://flowin-events.vercel.app/pro';
      if(c.s==='liens') return f([['Liens à usage unique',st.length],['Expiration','24 h']]);
      setTimeout(()=>brancherQr(u),0); return blocQr(u);
    }
    if(c.o==='souscription'){
      if(c.s==='pack') return f([['Pack souscrit','Pack Visibilité — 490 €'],['Stations incluses','2'],['Lots à fournir','10'],['Souscrit le','12/06/2026']]);
      if(c.s==='etapes') return tableau(
        [{k:'etape',l:'Étape'},{k:'quand',l:'Quand'},{k:'etat',l:'État'}],
        [{etape:'1 · Persona commerce',quand:'12/06',etat:'Fait'},
         {etape:'2 · Identité & adresse',quand:'12/06',etat:'Fait'},
         {etape:'3 · Banque de questions',quand:'13/06',etat:'Fait'},
         {etape:'4 · Récompense',quand:'13/06',etat:'Fait'},
         {etape:'5 · Dates & offre',quand:'14/06',etat:'Fait'},
         {etape:'6 · Pack de participation',quand:'14/06',etat:'Fait'},
         {etape:'7 · Diffusion',quand:'15/06',etat:'Fait'},
         {etape:'8 · Récapitulatif',quand:'15/06',etat:'Envoyé'}], null)+
        `<p style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px">
         Les 8 étapes du parcours de souscription que le commerce a réellement suivi
         sur <span class="mono">/rejoindre</span>. Aujourd'hui on ne voit que le résultat, jamais le chemin.</p>`;
      return f([['Demande reçue le','15/06/2026'],['Canal','Parcours /rejoindre'],['Super event visé','Nuits du Sud 2026'],['Statut','Acceptée le 18/06']]);
    }
    if(c.o==='commercial'){
      const colsDoc=[{k:'num',l:'N°'},{k:'objet',l:'Objet'},{k:'date',l:'Date'},{k:'montant',l:'Montant €',n:1},{k:'etat',l:'État'}];
      if(c.s==='bon') return tableau(colsDoc,[
        {num:'BC-2026-014',objet:'Pack Visibilité NDS 2026',date:'18/06',montant:490,etat:'Signé'}],null);
      if(c.s==='facture') return tableau(colsDoc,[
        {num:'FA-2026-031',objet:'Pack Visibilité NDS 2026',date:'01/07',montant:490,etat:'Payée'},
        {num:'FA-2026-048',objet:'Lots complémentaires (10 bons)',date:'12/07',montant:180,etat:'Payée'},
        {num:'FA-2026-057',objet:'Kit com supplémentaire A3',date:'20/07',montant:60,etat:'En attente'}],null)+
        f([['Total facturé','730 €'],['Encaissé','670 €'],['Reste dû','60 €']]);
      if(c.s==='reglement') return f([['Montant dû','0 €'],['Réglé le','09/07/2026'],['Moyen','Virement'],['Relances','aucune']]);
      return tableau(colsDoc,[
        {num:'DV-2026-022',objet:'Pack Visibilité NDS 2026',date:'15/06',montant:490,etat:'Accepté'}],null);
    }
    if(c.o==='lots'){
      const mes=LOTS.filter(l=>l.partenaire===p.nom).length?LOTS.filter(l=>l.partenaire===p.nom):LOTS.slice(0,2);
      if(c.s==='stock') return tableau(
        [{k:'nom',l:'Lot'},{k:'qte',l:'Fourni',n:1},{k:'restant',l:'Restant',n:1},{k:'distribue',l:'Distribué',n:1}],
        mes.map(l=>({nom:l.nom,qte:l.qte,restant:l.restant,distribue:l.qte-l.restant})), null);
      if(c.s==='valeur') return f([['Valeur unitaire moyenne',Math.round(mes.reduce((a,b)=>a+b.valeur,0)/mes.length)+' €'],
        ['Valeur totale fournie',mes.reduce((a,b)=>a+b.valeur*b.qte,0)+' €'],
        ['Valeur distribuée',mes.reduce((a,b)=>a+b.valeur*(b.qte-b.restant),0)+' €']]);
      return tableau(colsLot,mes,null);
    }
    if(c.o==='gagnants'){
      if(c.s==='billets') return f([['Billets générés','7'],['Validés en caisse','6'],['En attente','1'],['Double contrôle','QR du billet + numéro saisi en caisse']]);
      if(c.s==='retraits') return tableau(
        [{k:'joueur',l:'Joueur'},{k:'lot',l:'Lot'},{k:'quand',l:'Retiré le'},{k:'etat',l:'État'}],
        [{joueur:'Camille R.',lot:"Bon d'achat 30 €",quand:'21/07',etat:'Retiré'},
         {joueur:'Inès B.',lot:"Bon d'achat 30 €",quand:'23/07',etat:'Retiré'},
         {joueur:'Yanis M.',lot:'Panier gourmand',quand:'—',etat:'En attente'}], null);
      return tableau(colsJo,JOUEURS.filter(j=>j.lots>0),versJoueur);
    }
    if(c.o==='kit'){
      if(c.s==='visuels') return f([['Affiche A4','1 fichier'],['Visuels réseaux','4 formats'],['Spot vidéo','1'],['QR HD','600 × 600']]);
      if(c.s==='emails') return tableau(
        [{k:'nom',l:'Modèle'},{k:'objet',l:'Objet du mail'},{k:'envois',l:'Envoyés',n:1},{k:'maj',l:'Modifié le'}],
        [{nom:'Annonce du jeu',objet:'Un jeu chez nous pendant les Nuits du Sud',envois:1,maj:'20/06'},
         {nom:'Lot gagné',objet:'Vous avez gagné !',envois:7,maj:'22/06'},
         {nom:'Liste des gagnants',objet:'Vos gagnants à accueillir en boutique',envois:2,maj:'19/07'},
         {nom:'Relance retrait',objet:'Votre lot vous attend',envois:0,maj:'—'}], null)+
        `<p style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px">
         Les 3 premiers modèles existent déjà et sont éditables par partenaire.
         Le 4e n'a jamais servi : à supprimer, ou à activer.</p>`;
      return f([['Dossier partenaire','A3 · A4 · vidéo · QR'],['Généré le','20/06/2026'],['Lien','<span class="mono">/nds/kit-digital/…</span>']]);
    }
  }

  if(c.d==='jo'){
    const j=c.ctx||JOUEURS[0];
    if(c.o==='infos'){
      if(c.s==='rgpd') return f([['Opt-in',esc(j.optin)],['Source','Landing NDS 2026'],['Consentement','09/07']]);
      return f([['Nom',esc(j.nom)],['Ville',`${esc(j.ville)} (${esc(j.cp)})`],['Parties',j.parties],['Lots',j.lots]]);
    }
    if(c.o==='hist') return tableau(
      [{k:'nom',l:'Station'},{k:'module',l:'Jeu'},{k:'parties',l:'Parties',n:1}],
      STATIONS.slice(0,3).map(s=>({nom:s.nom,module:s.module,parties:2})), s=>{
        const st=STATIONS.find(x=>x.nom===s.nom); if(st) versEvent(st);
      });
    if(c.o==='lots'){
      if(c.s==='tickets') return f([['Billets','2'],['Validés en caisse','1']]);
      return tableau(colsLot,LOTS.slice(0,j.lots||1),l=>versPro(l.partenaire));
    }
  }
  return '';
}
rendre();
