<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=540">

<title>Films Flowin Event V4</title>
<style>
:root{--encre:#1B3A5C;--bleu:#3B5CC4;--bleuF:#2B47A8;--bleuC:#E3E9F8;--or:#C2410C;--or2:#FF8A14;--jaune:#FFC21A;--rouge:#E5322D;--nuit:#0E1B30;--ok:#0B7A4F;--trait:#DCE3EC;--acc:#3B5CC4;--hd:#3B5CC4}

*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#fff;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--encre)}
#st{position:relative;width:540px;height:960px;overflow:hidden;background:linear-gradient(180deg,#FFFFFF 0%,#EDF1FA 100%)}
body.se #st{background:linear-gradient(180deg,#0E1B30 0%,#172B4D 100%)}
.a{position:absolute}
.cap{left:30px;right:30px;top:74px}
.cap .h{font-size:43px;font-weight:900;line-height:1.05;letter-spacing:-.03em;color:var(--encre)}
.cap .h em{font-style:normal;color:var(--bleu)}
.cap .s{margin-top:12px;font-size:23px;font-weight:700;line-height:1.28;color:#465A76}
body.se .cap .h{color:#fff}body.se .cap .h em{color:#FF8A14}body.se .cap .s{color:#C3CEDF}
.tag{display:inline-block;padding:6px 12px;border-radius:99px;font-size:14px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;background:var(--encre);color:#fff;margin-bottom:12px}
body.se .tag{background:#FF8A14;color:#0E1B30}
.tag.old{background:#8A97A8}
.logo{left:30px;top:26px;font-weight:900;font-size:21px;letter-spacing:-.01em;color:var(--encre)}.logo b{color:var(--bleu)}
body.se .logo{color:#fff}body.se .logo b{color:#FF8A14}
.selogo{right:30px;top:20px;height:34px}
.ex{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8494AA}
/* téléphone */
.phone{width:262px;height:530px;border-radius:42px;background:#0F172A;padding:10px;box-shadow:0 34px 60px -28px rgba(10,20,40,.6)}
.phone:before{content:"";position:absolute;left:50%;top:18px;width:70px;height:18px;margin-left:-35px;border-radius:10px;background:#0F172A;z-index:3}
.scr{width:100%;height:100%;border-radius:33px;background:#fff;overflow:hidden;position:relative}
.scr .top{height:84px;background:var(--hd);color:#fff;display:flex;align-items:flex-end;gap:9px;padding:0 16px 13px;font-weight:800;font-size:15px}
.mono{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--hd);display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.view{position:absolute;left:0;right:0;top:84px;bottom:0;padding:16px 15px}
.q{font-size:18px;font-weight:800;line-height:1.22;margin-bottom:14px;color:var(--encre)}
.opt{border:2px solid var(--trait);border-radius:14px;padding:12px;font-size:15px;font-weight:700;margin-bottom:9px;background:#fff;color:var(--encre)}
.opt.on{border-color:var(--hd);background:var(--hd);color:#fff}
.btn{background:var(--hd);color:#fff;border-radius:99px;text-align:center;font-weight:800;padding:14px;font-size:16px}
.btn.dn{filter:brightness(.82)}
.kick{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--hd);margin-bottom:6px}
.tile{border:2px solid var(--trait);border-radius:14px;padding:12px;font-weight:800;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:10px;color:var(--encre)}
.tile i{width:26px;height:26px;border-radius:8px;background:#E3E9F8;flex:none}
.tile.on{border-color:var(--hd);background:#E3E9F8}
.card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 14px 30px -18px rgba(10,25,50,.55);color:var(--encre)}
.card b{font-weight:900}
.bar{height:16px;border-radius:9px;background:#E3E9F8;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.big{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:10px;margin-top:9px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;flex:none}
.ln{height:10px;border-radius:6px;background:#DCE3EC;flex:1}
/* ticket */
.slot{width:250px;height:24px;border-radius:12px;background:#0F172A}
.mask{width:226px;overflow:hidden;height:250px;margin-left:12px}
.tk{width:226px;background:#fff;border-radius:0 0 16px 16px;padding:18px 16px 18px;text-align:center;border-top:8px solid var(--acc);color:var(--encre);box-shadow:0 10px 24px -14px rgba(0,0,0,.4)}
.tk .g{font-size:24px;font-weight:900;line-height:1.1;margin:8px 0}
.tk .m{font-size:14px;font-weight:700;color:#5a6b80}
.tk .cut{margin:14px -16px 0;border-top:2px solid #E3E9F8}
.fin{left:0;right:0;top:0;bottom:0;background:var(--encre);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:40px}
body.se .fin{background:#0E1B30}
.fin .l{font-size:46px;font-weight:900;line-height:1.05;letter-spacing:-.03em}.fin .l b{color:#9DB0F0}
body.se .fin .l b{color:#FF8A14}
.fin .s{font-size:22px;font-weight:700;opacity:.9}

body.se .fin .c{background:#FF8A14;color:#0E1B30}
.qrb{background:#fff;border-radius:22px;padding:16px}
.qrb svg{display:block;width:200px;height:200px}
.url{font-size:19px;font-weight:800;letter-spacing:.01em}
.small{font-size:15px;font-weight:700;opacity:.7}
.lbl{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#5a6b80}
.pill{display:inline-block;padding:8px 14px;border-radius:99px;font-weight:900;font-size:15px;background:var(--acc);color:#fff}

/* planche */
.pl{position:absolute;inset:0;background:#fff;display:flex;flex-wrap:wrap;padding:20px}
.pl div{width:50%;height:460px;text-align:center;font-weight:900;font-size:20px}

<body><div id="st"></div>
<script>
/* Films V4 Flowin Event. Rendu image par image : window.render(t) dessine l'instant t (secondes).
   #f1 .. #f5 (film complet), #f1-15 .. #f5-15 (version courte), #planche (personnages). */
var H=(location.hash||'#f1').slice(1), COURT=H.indexOf('-15')>0, FILM=H.split('-')[0], st=document.getElementById('st');
var SE=FILM==='f3'||FILM==='f4'||FILM==='f5'; if(SE)document.body.className='se';
function e(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function cl(x){return x<0?0:x>1?1:x}
function ease(x){x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3)}
function bk(x){x=cl(x);var c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function win(t,a,b){return cl((t-a)/(b-a))}
function lerp(a,b,p){return a+(b-a)*p}
function at(el,x,y,s,o,r){if(!el)return;el.style.transform='translate('+x+'px,'+y+'px) scale('+(s==null?1:s)+')'+(r?' rotate('+r+'deg)':'');el.style.opacity=o==null?1:o;}
function $(el,s){return el.querySelector(s)}
function $$(el,s){return el.querySelectorAll(s)}
var S=[]; function scene(d,build,anim,court){var a=S.length?S[S.length-1].b:0;S.push({a:a,b:a+d,d:d,build:build,anim:anim||function(){},court:!!court,els:null});}
function cap(h,s,tag){return '<div class="a cap">'+(tag?'<div class="tag'+(tag.indexOf('Avant Flowin')===0?' old':'')+'">'+tag+'</div>':'')+'<div class="h">'+h.replace(/ ([?:!])/g,'&nbsp;$1')+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';}
function A(x,y,inner,extra){return '<div class="a" style="left:'+x+'px;top:'+y+'px;'+(extra||'')+'">'+inner+'</div>';}

/* ================= PERSONNAGES (illustration plate, viewBox 200x400) ================= */
var CH={
 alex:{skin:'#E6AE86',sk2:'#C98F68',hair:'#2E2119',top:'#3B5CC4',top2:'#2B47A8',pants:'#1B3A5C',shoe:'#14202E'},
 lea:{skin:'#F3CBAA',sk2:'#DCA987',hair:'#8A3F1A',top:'#FF8A14',top2:'#E06E00',pants:'#1B3A5C',shoe:'#FFFFFF'},
 max:{skin:'#9B623F',sk2:'#7E4C2F',hair:'#1A120E',top:'#FFC21A',top2:'#E8A800',pants:'#3B5CC4',shoe:'#14202E'},
 sam:{skin:'#D8A07B',sk2:'#B9805C',hair:'#1F2937',top:'#C2410C',top2:'#9A3409',pants:'#1B3A5C',shoe:'#14202E'}
};
var R=Math.PI/180;
function limb(sx,sy,a1,a2,l1,l2){var ex=sx+Math.sin(a1*R)*l1,ey=sy+Math.cos(a1*R)*l1,hx=ex+Math.sin(a2*R)*l2,hy=ey+Math.cos(a2*R)*l2;return {ex:ex,ey:ey,hx:hx,hy:hy};}
function armSvg(c,sx,sy,a1,a2,item){var k=limb(sx,sy,a1,a2,50,46);
 var s='<path d="M'+sx+' '+sy+'L'+k.ex.toFixed(1)+' '+k.ey.toFixed(1)+'L'+k.hx.toFixed(1)+' '+k.hy.toFixed(1)+'" stroke="'+c.top+'" stroke-width="25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 s+='<circle cx="'+k.hx.toFixed(1)+'" cy="'+k.hy.toFixed(1)+'" r="12.5" fill="'+c.skin+'"/>';
 if(item==='phone')s+='<g transform="translate('+(k.hx-13).toFixed(1)+' '+(k.hy-30).toFixed(1)+')"><rect width="26" height="46" rx="6" fill="#0F172A"/><rect x="3" y="5" width="20" height="34" rx="3" fill="'+(SE?'#FF8A14':'#7F98E6')+'"/></g><circle cx="'+(k.hx+9).toFixed(1)+'" cy="'+(k.hy+4).toFixed(1)+'" r="7" fill="'+c.skin+'"/>';
 if(item==='poster')s+='<g transform="translate('+(k.hx-30).toFixed(1)+' '+(k.hy-78).toFixed(1)+')"><rect width="60" height="80" rx="5" fill="#fff" stroke="#0E1B30" stroke-width="3"/><rect x="6" y="6" width="48" height="22" rx="3" fill="#FF8A14"/><rect x="16" y="36" width="28" height="28" fill="#0E1B30"/><rect x="21" y="41" width="18" height="18" fill="#fff"/><rect x="26" y="46" width="8" height="8" fill="#0E1B30"/></g><circle cx="'+k.hx.toFixed(1)+'" cy="'+k.hy.toFixed(1)+'" r="12.5" fill="'+c.skin+'"/>';
 if(item==='ticket')s+='<g transform="translate('+(k.hx-18).toFixed(1)+' '+(k.hy-46).toFixed(1)+') rotate(-8)"><rect width="38" height="50" rx="5" fill="#fff" stroke="'+(SE?'#C2410C':'#3B5CC4')+'" stroke-width="3"/><rect x="7" y="9" width="24" height="5" rx="2" fill="'+(SE?'#C2410C':'#3B5CC4')+'"/><rect x="7" y="19" width="18" height="4" rx="2" fill="#C9D3E2"/></g><circle cx="'+k.hx.toFixed(1)+'" cy="'+k.hy.toFixed(1)+'" r="12.5" fill="'+c.skin+'"/>';
 return s;}
var POSE={ /* [bras gauche a1,a2 , bras droit a1,a2] ; gauche = côté gauche de l'image */
 debout:[[-10,-4],[10,4]], telephone:[[-10,-4],[20,228]], bras:[[-10,-4],[160,172]], deuxbras:[[-150,-165],[150,165]],
 coucou:[[-10,-4],[135,190]], tend:[[-10,-4],[78,92]], tendg:[[-78,-92],[10,4]], affiche:[[-10,-4],[150,180]], mains:[[-28,-120],[28,120]], ticket:[[-10,-4],[150,178]]};
function face(c,expr,look){var lx=look||0,s='';
 /* yeux */
 if(expr==='joie'){s+='<path d="M'+(80+lx)+' 86q6-8 12 0M'+(108+lx)+' 86q6-8 12 0" stroke="#1B2433" stroke-width="4.5" fill="none" stroke-linecap="round"/>';}
 else{s+='<ellipse cx="'+(86+lx)+'" cy="85" rx="4.6" ry="5.6" fill="#1B2433"/><ellipse cx="'+(114+lx)+'" cy="85" rx="4.6" ry="5.6" fill="#1B2433"/><circle cx="'+(87.5+lx)+'" cy="83" r="1.5" fill="#fff"/><circle cx="'+(115.5+lx)+'" cy="83" r="1.5" fill="#fff"/>';}
 /* sourcils */
 var by=expr==='triste'||expr==='doute'?71:70, tilt=expr==='triste'?' rotate(-10 86 72)':'',tilt2=expr==='triste'?' rotate(10 114 72)':(expr==='doute'?' rotate(-6 114 72)':'');
 s+='<g transform="translate(0 0)'+tilt+'"><rect x="'+(78+lx)+'" y="'+(by-3)+'" width="16" height="4.5" rx="2.2" fill="'+c.hair+'"/></g><g transform="translate(0 '+(expr==='doute'?-3:0)+')'+tilt2+'"><rect x="'+(106+lx)+'" y="'+(by-3)+'" width="16" height="4.5" rx="2.2" fill="'+c.hair+'"/></g>';
 /* nez */
 s+='<path d="M'+(100+lx*.6)+' 92q-4 9 1 11" stroke="'+c.sk2+'" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
 /* joues */
 s+='<circle cx="'+(76+lx*.5)+'" cy="101" r="6" fill="#F08A7E" opacity=".35"/><circle cx="'+(124+lx*.5)+'" cy="101" r="6" fill="#F08A7E" opacity=".35"/>';
 /* bouche */
 var mx=100+lx*.6;
 if(expr==='joie')s+='<path d="M'+(mx-14)+' 108q14 3 28 0q-2 16-14 16t-14-16z" fill="#7A2230"/><path d="M'+(mx-7)+' 118q7-5 14 0q-3 5-7 5t-7-5z" fill="#E9707A"/>';
 else if(expr==='sourire')s+='<path d="M'+(mx-11)+' 109q11 10 22 0" stroke="#7A2230" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
 else if(expr==='triste')s+='<path d="M'+(mx-9)+' 115q9-7 18 0" stroke="#7A2230" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
 else if(expr==='doute')s+='<path d="M'+(mx-9)+' 112q9 2 18-3" stroke="#7A2230" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
 else if(expr==='o')s+='<ellipse cx="'+mx+'" cy="113" rx="6" ry="7" fill="#7A2230"/>';
 else s+='<path d="M'+(mx-8)+' 111h16" stroke="#7A2230" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
 return s;}
function perso(nom,pose,expr,o){o=o||{};var c=CH[nom],P=POSE[pose]||POSE.debout,s='',hr=o.tete||0,look=o.regard||0;
 var back='',front='',body='',acc='';
 if(nom==='lea'){back='<path d="M56 92Q48 30 100 30Q152 30 146 92L152 168Q150 178 138 176L132 120L68 120L62 176Q50 178 48 168Z" fill="'+c.hair+'"/>';
  front='<path d="M58 86Q56 36 100 36Q144 36 142 86Q138 62 118 54Q104 70 70 70Q62 76 58 86Z" fill="'+c.hair+'"/><circle cx="138" cy="58" r="9" fill="#FFC21A"/>';}
 if(nom==='alex'){front='<path d="M58 84Q54 34 100 34Q148 34 142 84Q140 66 132 62Q118 54 100 56Q80 56 68 62Q60 68 58 84Z" fill="'+c.hair+'"/>';
  acc='<path d="M60 92Q60 134 100 134Q140 134 140 92Q137 90 134 94Q130 118 100 119Q70 118 66 94Q63 90 60 92Z" fill="'+c.hair+'"/>';}
 if(nom==='max'){var cc='',k;for(k=0;k<11;k++){var ang=(-170+k*16)*R;cc+='<circle cx="'+(100+Math.cos(ang)*40).toFixed(1)+'" cy="'+(80+Math.sin(ang)*44).toFixed(1)+'" r="15" fill="'+c.hair+'"/>';}
  front='<g>'+cc+'<path d="M62 80Q64 44 100 42Q136 44 138 80Q120 64 100 64Q80 64 62 80Z" fill="'+c.hair+'"/></g>';}
 if(nom==='sam'){back='<path d="M54 118Q44 34 100 32Q156 34 146 118Q140 126 132 120L132 84L68 84L68 120Q60 126 54 118Z" fill="'+c.hair+'"/>';
  front='<path d="M58 84Q58 38 100 36Q142 38 142 84Q128 60 96 62Q86 74 58 84Z" fill="'+c.hair+'"/>';
  acc='<circle cx="86" cy="86" r="11.5" fill="none" stroke="#0E1B30" stroke-width="3.5"/><circle cx="114" cy="86" r="11.5" fill="none" stroke="#0E1B30" stroke-width="3.5"/><path d="M97.5 86h5" stroke="#0E1B30" stroke-width="3.5"/>'+
   '<path d="M58 90Q56 26 100 26Q144 26 142 90" fill="none" stroke="#0E1B30" stroke-width="6" stroke-linecap="round"/><rect x="50" y="80" width="14" height="24" rx="6" fill="#0E1B30"/><path d="M57 102Q60 120 82 118" stroke="#0E1B30" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="84" cy="118" r="4.5" fill="#0E1B30"/>';}
 /* corps */
 body+='<path d="M68 264L132 264L131 352L106 352L100 300L94 352L69 352Z" fill="'+c.pants+'"/>';
 body+='<path d="M64 350h34q4 0 4 6v6q0 4-4 4H58q-6 0-6-5q0-11 12-11z" fill="'+c.shoe+'"'+(c.shoe==='#FFFFFF'?' stroke="#1B3A5C" stroke-width="3"':'')+'/><path d="M136 350h-34q-4 0-4 6v6q0 4 4 4h40q6 0 6-5q0-11-12-11z" fill="'+c.shoe+'"'+(c.shoe==='#FFFFFF'?' stroke="#1B3A5C" stroke-width="3"':'')+'/>';
 body+='<rect x="90" y="118" width="20" height="24" fill="'+c.sk2+'"/>';
 if(nom==='max')body+='<path d="M64 146Q66 128 100 126Q134 128 136 146" fill="'+c.top2+'"/>';
 body+='<path d="M54 156Q54 136 80 134L120 134Q146 136 146 156L140 270Q100 278 60 270Z" fill="'+c.top+'"/>';
 if(nom==='alex')body+='<path d="M84 134L100 150L116 134" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M72 172L128 172L131 274Q100 280 69 274Z" fill="#1B3A5C"/><path d="M78 172L82 136M122 172L118 136" stroke="#1B3A5C" stroke-width="5"/><rect x="86" y="196" width="28" height="22" rx="4" fill="#2B4A72"/><circle cx="100" cy="182" r="5" fill="#fff"/>';
 if(nom==='lea')body+='<path d="M84 134Q100 152 116 134" fill="'+c.sk2+'"/><path d="M84 134Q100 150 116 134" fill="none" stroke="'+c.top2+'" stroke-width="5"/><path d="M64 246L136 246L136 272Q100 280 64 272Z" fill="'+c.top2+'"/>';
 if(nom==='max')body+='<path d="M90 138L88 172M110 138L112 172" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M76 214Q100 208 124 214L122 244L78 244Z" fill="'+c.top2+'"/>';
 if(nom==='sam')body+='<path d="M86 134L100 162L114 134Z" fill="#fff"/><path d="M100 162L100 272" stroke="'+c.top2+'" stroke-width="4"/><path d="M86 134L100 192L114 134" fill="none" stroke="#0E1B30" stroke-width="3.5"/><rect x="88" y="192" width="24" height="32" rx="4" fill="#fff" stroke="#0E1B30" stroke-width="3"/><rect x="92" y="198" width="16" height="6" rx="2" fill="#FFC21A"/><rect x="92" y="208" width="16" height="4" rx="2" fill="#E5322D"/>';
 var arms=armSvg(c,60,154,P[0][0],P[0][1],o.itemG)+armSvg(c,140,154,P[1][0],P[1][1],o.item||(pose==='telephone'?'phone':pose==='affiche'?'poster':pose==='ticket'?'ticket':''));
 var head='<g transform="rotate('+hr+' 100 130) translate(100 132) scale(1.14) translate(-100 -132)">'+back+'<circle cx="59" cy="90" r="9" fill="'+c.skin+'"/><circle cx="141" cy="90" r="9" fill="'+c.skin+'"/><ellipse cx="100" cy="86" rx="41" ry="45" fill="'+c.skin+'"/>'+(nom==='alex'?acc:'')+face(c,expr||'sourire',look)+front+(nom==='sam'?acc:'')+'</g>';
 var behind=pose==='telephone'||pose==='mains'||pose==='ticket';
 return '<svg viewBox="0 0 200 400" width="'+(o.w||200)+'" height="'+((o.w||200)*2)+'" style="display:block;overflow:visible"><g transform="translate(0 30)">'+body+(behind?head+arms:arms+head)+'</g></svg>';}
function P(nom,pose,expr,o){return '<div class="pp" data-n="'+nom+'">'+perso(nom,pose,expr,o)+'</div>';}
function repose(el,nom,pose,expr,o){el.innerHTML=perso(nom,pose,expr,o);}

/* ================= ACCESSOIRES ================= */
function doigt(){return '<div class="a fg" style="left:0;top:0;opacity:0;z-index:20"><svg width="84" height="150" viewBox="0 0 84 150"><rect x="30" y="0" width="22" height="78" rx="11" fill="#F3CBAA"/><rect x="12" y="52" width="60" height="76" rx="26" fill="#F3CBAA"/><rect x="52" y="54" width="20" height="40" rx="10" fill="#E9B993"/><rect x="34" y="6" width="14" height="10" rx="5" fill="#FBE2CF"/><rect x="14" y="118" width="56" height="32" rx="6" fill="'+(SE?'#C2410C':'#3B5CC4')+'"/></svg></div>';}
/* place le bout du doigt en (x,y) */
function fgAt(f,x,y,s,o){at(f,x-41,y-3,s,o);}
function tap(f,t,x,y,t0,tt,t1){ /* arrive en t0..tt, appuie à tt, repart à t1 */
