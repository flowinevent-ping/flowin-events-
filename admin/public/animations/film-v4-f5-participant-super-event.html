<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Flowin Super Event · participant · Flowin</title>
<meta property="og:title" content="Flowin Super Event · participant">
<meta property="og:image" content="https://flowin-events.vercel.app/videos/v4/f5-participant-super-event.jpg">
<style>
  html,body{margin:0;height:100%;background:#0b1626;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .scene{position:relative;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .fin{position:absolute;inset:0;background:rgba(11,22,38,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .fin.on{display:flex}
  .fin h1{font-size:22px;margin:0 0 6px;line-height:1.25}
  .btn{display:block;box-sizing:border-box;width:100%;max-width:340px;min-height:52px;line-height:52px;border-radius:14px;font-size:17px;font-weight:800;text-decoration:none;text-align:center;border:0;cursor:pointer;font-family:inherit;color:#fff}
  .b1{background:#C2410C}
  .b2{background:#fff;color:#1B3A5C}
  .courte{position:absolute;bottom:64px;left:0;right:0;text-align:center}
  .courte a{display:inline-block;background:rgba(11,22,38,.85);color:#fff;font-size:14px;font-weight:700;text-decoration:underline;border-radius:10px;padding:8px 14px}
  .rejouer{background:none;border:0;color:#cbd5e1;font-size:14px;text-decoration:underline;cursor:pointer;font-family:inherit}
  .prep{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;background:#0b1626}
  .prep.on{display:flex}
</style>
</head>
<body>
<div class="scene">
  <video id="v" controls playsinline preload="metadata" poster="/videos/v4/f5-participant-super-event.jpg" src="/videos/v4/f5-participant-super-event.mp4"></video>
  <div class="courte"><a id="ver" href="#">Version courte</a></div>
  <div class="prep" id="prep"><strong>Vidéo indisponible</strong><span>Rechargez la page dans un instant.</span></div>
  <div class="fin" id="fin">
    <h1>Flowin Super Event · participant</h1>
    <a class="btn b1" id="com" href="/se/se-master-superevent">Je joue</a>
    <button class="rejouer" id="rej" type="button">Revoir la vidéo</button>
  </div>
</div>
<script>
(function(){
  var DEFAUT = 'video-participant-se';
  var m = /[?&]src=([a-z0-9_-]{1,40})/i.exec(location.search);
  var src = m ? m[1].toLowerCase() : DEFAUT;
  try { if (!window.localStorage.getItem('flowin_src')) window.localStorage.setItem('flowin_src', src); } catch (e) {}
  function avecSrc(u) { var i = u.indexOf('#'), h = i >= 0 ? u.slice(i) : '', b = i >= 0 ? u.slice(0, i) : u; return b + (b.indexOf('?') >= 0 ? '&' : '?') + 'src=' + encodeURIComponent(src) + h; }
  var liens = document.querySelectorAll('#com, #sec');
  for (var i = 0; i < liens.length; i++) liens[i].setAttribute('href', avecSrc(liens[i].getAttribute('href')));
  var court = /[?&]v=courte/.test(location.search);
  var v = document.getElementById('v'), fin = document.getElementById('fin'), prep = document.getElementById('prep');
  if (court) { v.setAttribute('src', '/videos/v4/f5-15s.mp4'); }
  var lv = document.getElementById('ver');
  lv.textContent = court ? 'Version longue' : 'Version courte';
  var qs = location.search.replace(/[?&]v=courte/, '').replace(/^&/, '?');
  lv.setAttribute('href', location.pathname + (court ? qs : (qs ? qs + '&' : '?') + 'v=courte'));
  v.addEventListener('error', function(){ prep.className = 'prep on'; v.style.display = 'none'; });
  v.addEventListener('ended', function(){ fin.className = 'fin on'; });
  v.addEventListener('play', function(){ fin.className = 'fin'; });
  document.getElementById('rej').addEventListener('click', function(){ fin.className = 'fin'; v.currentTime = 0; v.play(); });
})();
</script>
</body>
</html>
