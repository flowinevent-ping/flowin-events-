<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Flowin Pro</title>
<link rel="manifest" href="/manifest-pro.json">
<link rel="icon" type="image/png" href="/icon-fp-192.png">
<link rel="apple-touch-icon" href="/icon-fp-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flowin Pro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B3A5C">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F6F9;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1B3A5C}
.c{max-width:420px;width:100%;margin:16px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(27,58,92,.12);padding:28px 24px;text-align:center}
.c img{width:96px;height:96px;border-radius:22px}
h1{font-size:24px;margin:16px 0 4px}
p{color:#5b6b80;line-height:1.5;margin:8px 0}
.b{display:block;margin:12px 0 0;padding:14px;border-radius:12px;background:#7A4FE0;color:#fff;font-weight:700;text-decoration:none;font-size:16px}
.b2{background:#fff;color:#1B3A5C;border:2px solid #DCE3EC}
.s{margin-top:16px;padding:12px 14px;border-radius:12px;background:#EEF2FB;text-align:left;font-size:14px;color:#1B3A5C}
</style>
</head>
<body>
<div class="c">
  <img src="/icon-fp-192.png" alt="Flowin Pro">
  <h1>Flowin Pro</h1>
  <p>Votre espace commerçant ou organisateur : jeux, lots, clients.</p>
  <a class="b" href="/pro">Ouvrir mon espace pro</a>
  <a class="b b2" href="/pro/premiere-fois">Créer mon compte pro</a>
  <div class="s">
    <b>Installer l'application</b><br>
    iPhone : Partager, puis « Sur l'écran d'accueil ».<br>
    Android et ordinateur : menu du navigateur, puis « Installer l'application ».
  </div>
</div>
<script>
/* Application installee : on ouvre directement l'espace, sans repasser par cette page. */
(function () {
  var standalone = false;
  try { standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; } catch (e) {}
  if (standalone) { window.location.replace("/pro"); }
})();
</script>
</body>
</html>
