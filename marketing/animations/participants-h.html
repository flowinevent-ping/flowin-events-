:root{--bg:#150C1C;--card:#1E1226;--txt:#F6F1FA;--mut:#BBAACB;--line:rgba(255,255,255,.12);--mag:#E0218A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,sans-serif}
body.record #ui,body.record #side{display:none}
body.record #wrap{display:block;padding:0}
body.record #left{position:static;max-width:none;margin:0;width:540px}
body.record #stage{width:540px;height:960px;border-radius:0;box-shadow:none}
body.record svg{display:block;width:540px;height:960px}
#wrap{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:32px;max-width:1180px;margin:0 auto;padding:28px 20px;align-items:start}
#left{position:sticky;top:20px}
#stage{width:100%;aspect-ratio:9/16;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#stage svg{display:block;width:100%;height:100%}
#ui{display:flex;gap:8px;align-items:center;margin-top:12px}
#ui button{font:800 14px Manrope,sans-serif;border:0;border-radius:100px;padding:10px 16px;background:var(--mag);color:#fff;cursor:pointer}
#ui button#restart{background:rgba(255,255,255,.1)}
#range{flex:1;accent-color:#E0218A}
#time{font:700 13px Manrope,sans-serif;min-width:84px;text-align:right;color:var(--mut)}
.eyebrow{font:800 12px Manrope,sans-serif;letter-spacing:.14em;color:var(--mag)}
h1{font:800 clamp(28px,4vw,44px)/1.05 Manrope,sans-serif;letter-spacing:-.04em;margin:10px 0 8px}
.sous{color:var(--mut);font:600 16px/1.5 Manrope,sans-serif;margin:0 0 22px;max-width:620px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:grid;grid-template-columns:92px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:.2s}
li.on{border-color:var(--mag);background:rgba(224,33,138,.12)}
.tc{font:800 13px Manrope,sans-serif;color:var(--mut);padding-top:3px}
li.on .tc{color:var(--mag)}
.st{font:800 18px Manrope,sans-serif;letter-spacing:-.02em}
.sd{font:600 14px/1.45 Manrope,sans-serif;color:var(--mut);margin-top:4px}
.se{font:700 13.5px/1.4 Manrope,sans-serif;margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06)}
.se b{color:var(--mag);font-weight:800;margin-right:6px}
@media (max-width:820px){#wrap{grid-template-columns:1fr}#left{position:static;max-width:380px;margin:0 auto;width:100%}}

    ecranBonus: function (choix) {

    },
    ecranScan: function (sw, sh) {
      var q = sw * 0.6, qx = (sw - q) / 2, qy = sh * 0.3, c = sw * 0.12, m = 22, x0 = qx - m, y0 = qy - m, x1 = qx + q + m, y1 = qy + q + m
      return '<rect width="' + sw + '" height="' + sh + '" fill="#2A2230"/>' + F.qr(qx, qy, q) +
        '<path d="M' + x0 + ',' + (y0 + c) + ' L' + x0 + ',' + y0 + ' L' + (x0 + c) + ',' + y0 + ' M' + (x1 - c) + ',' + y0 + ' L' + x1 + ',' + y0 + ' L' + x1 + ',' + (y0 + c) + ' M' + x1 + ',' + (y1 - c) + ' L' + x1 + ',' + y1 + ' L' + (x1 - c) + ',' + y1 + ' M' + (x0 + c) + ',' + y1 + ' L' + x0 + ',' + y1 + ' L' + x0 + ',' + (y1 - c) + '" stroke="#fff" stroke-width="' + sw * 0.025 + '" fill="none" stroke-linecap="round"/>' +

        '<text x="' + (-w / 2 + w * 0.08) + '" y="' + (-h / 2 + h * 0.2) + '" font-family="Manrope" font-weight="800" font-size="' + w * 0.045 + '" letter-spacing="' + w * 0.005 + '" fill="' + C.mag + '">TON TICKET</text>' +

        '<text x="' + (-w / 2 + w * 0.08) + '" y="' + h * 0.32 + '" font-family="Manrope" font-weight="700" font-size="' + w * 0.05 + '" fill="#6b6174">Tirage au sort</text>' +
        '<text x="' + (-w / 2 + w * 0.08) + '" y="' + h * 0.42 + '" font-family="Manrope" font-weight="700" font-size="' + w * 0.042 + '" fill="#9d8fab">Nuits du Sud · Vence</text>' +
        '</g>'

  var SC, total = 0, svgEl, playing = false, t0 = 0, cur = 0
  function scenes() { var a = 0; return SC.scenes.map(function (s) { var o = { label: s.label, start: a, dur: s.dur, caption: s.caption || '' }; a += s.dur; return o }) }

  function render(t) {
    uid = 0
    t = clamp(t, 0, total - 1e-4)

      g += '<clipPath id="' + cid + '"><circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + r.toFixed(1) + '"/></clipPath><g clip-path="url(#' + cid + ')">' + dessine(s, lt, i) + '</g>'
      g += F.anneau(p[0], p[1], r, 1 - lt / TR, 4)
    } else g += dessine(s, lt, i)

    cur = i

    var w = []
    var els = svgEl.querySelectorAll('text.safe')
    for (var k = 0; k < els.length; k++) {
      if (+els[k].getAttribute('opacity') < 0.5) continue

      // Mots géants : le haut visible est la hauteur des capitales, pas la boîte de la police.
      if (cap) b = { x: b.x, width: b.width, y: +els[k].getAttribute('y') - +cap, height: +cap }
      if (b.y < SAFE.top - 2 || b.y + b.height > SAFE.bottom + 2 || b.x + b.width > SAFE.right + 2 || b.x < SAFE.left - 2) w.push('texte hors zone sûre : « ' + els[k].textContent + ' »')
    }
    window.__warnings = w
  }

  function fmt(x) { var m = Math.floor(x / 60), s = Math.floor(x % 60); return m + ':' + (s < 10 ? '0' : '') + s }
  function boucle() {
    if (!playing) return
    var t = (performance.now() - t0) / 1000
    if (t >= total) { t = total - 1e-3; playing = false; document.getElementById('play').textContent = 'Lecture' }
    seek(t, true)
    if (playing) requestAnimationFrame(boucle)
  }
  var tc = 0
  function seek(t, interne) {
    tc = t
    render(t)
    var r = document.getElementById('range'), tm = document.getElementById('time')
    if (r) r.value = Math.round(t / total * 1000)
    if (tm) tm.textContent = fmt(t) + ' / ' + fmt(total)
    if (!interne && playing) t0 = performance.now() - t * 1000
  }

  window.FLH = {
    start: function (sc) {
      SC = sc; svgEl = document.getElementById('svg')
      total = sc.scenes.reduce(function (a, s) { return a + s.dur }, 0)
      if (location.hash === '#record') document.body.className = 'record'
      var mots = []; sc.scenes.forEach(function (s) { (s.mots || []).forEach(function (m) { mots.push(m) }) })
      document.fonts.ready.then(function () {
        mesurer(mots)
        window.ANIM = { duration: total, scenes: scenes(), seek: function (x) { seek(x) }, ready: true }
        render(0)
        var play = document.getElementById('play')
        if (play) {
          play.onclick = function () {
            if (playing) { playing = false; play.textContent = 'Lecture'; return }
            if (tc >= total - 0.01) tc = 0
            playing = true; play.textContent = 'Pause'; t0 = performance.now() - tc * 1000; requestAnimationFrame(boucle)
          }

          for (var k = 0; k < items.length; k++) (function (el) { el.onclick = function () { seek(window.ANIM.scenes[+el.dataset.scene].start + 0.6) } })(items[k])
          window.__onScene = function (i) { for (var k = 0; k < items.length; k++) items[k].classList.toggle('on', +items[k].dataset.scene === i) }
          seek(0)
        }
      })
    }
  }
})()
</script>

(function () {
  var F = window.FH, C = F.C, Y0 = 172

  // Pastille de numéro : cercle blanc, chiffre encre.

  function progres(n, col) {

    for (var k = 0; k < 4; k++) g += '<rect x="' + (140 + k * 62) + '" y="848" width="54" height="6" rx="3" fill="' + col + '" opacity="' + (k < n ? 0.9 : 0.25) + '"/>'
    return g
  }
  var LOTS = 'Bons d’achat, lots, places de concert.'

  window.SCENARIO = {
    titre: 'Comment on joue avec Flowin',
    sous: 'Le guide du joueur en 4 étapes.',
    end: { mode: 'qr' },
    scenes: [
      {
        label: 'Accroche', dur: 3, bg: C.mag, mots: ['COMMENT', 'ON JOUE ?'],
        caption: 'Flowin, le jeu de tes commerçants et de ton festival.',
        desc: 'Image 0 lisible : la question que se pose le joueur, et l’objet à repérer (le sticker).',
        draw: function (lt, img0) {
